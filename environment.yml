# OmicsWeave 独立 Conda 环境配置（推荐在所有开发机与测试机使用，避免污染 Anaconda base 环境）。
#
# 创建并安装（在仓库根目录执行）：
#   conda env create -f environment.yml
#   conda activate omicsweave
#   pip install -e . --no-deps
#
# 更新已有环境：
#   conda env update -f environment.yml --prune
#   conda activate omicsweave
#   pip install -e . --no-deps
#
# 说明：
# - 仅通过 conda 安装干净的 Python 3.12 与 pip，所有科学计算包统一通过 pip wheel 安装，
#   确保统一的 NumPy ABI，且不会带入旧版 Anaconda base 中的 dask / numexpr 等冲突包。
# - 版本下限与 pyproject.toml 的 dependencies + [all] 保持一致。
name: omicsweave
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip>=24
  - pip:
      # 核心依赖（对应 pyproject.toml [project.dependencies]）
      - numpy>=1.24
      - pandas>=2.0
      - scipy>=1.10
      - matplotlib>=3.7
      - PyYAML>=6.0
      - openpyxl>=3.1
      - pydantic>=2.6
      - pyarrow>=14
      # 多组学分析与整合依赖（对应 pyproject.toml [all]）
      - seaborn>=0.12
      - scikit-learn>=1.2
      - statsmodels>=0.14
      - pydeseq2>=0.4
      - gseapy>=1.1
      - adjustText>=0.8
      # 开发与测试依赖（可选；如不需要可注释）
      - pytest>=7.4
      # 上游 FASTQ 原始数据修剪依赖（仅处理 FASTQ 时取消注释）
      # - cutadapt>=4.0
