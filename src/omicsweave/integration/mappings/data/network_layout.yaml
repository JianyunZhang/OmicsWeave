# Design spec: docs/arch_design/omicsweave_pathway_map.md Section 3.
#
# Canvas units: width 164, height 118 (origin top-left, y downward).
# Dual-layer compatibility: `network_sha256` strictly tracks MFA `network_reactions.tsv`.
# Curated edges in `curated_reactions.tsv` render as omics-only dashed arrows and automatically
# promote to solid flux edges if a future MFA model adds the same reaction ID.

