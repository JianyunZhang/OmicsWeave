[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omicsweave"
dynamic = ["version"]
description = "A Modular Python Toolkit for Multi-Omics Data Analysis and Integration"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jianyun Zhang" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# 所有模块共用的轻量依赖；各组学的专属依赖放在 optional-dependencies 中。
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "pydantic>=2.6",
    "pyarrow>=14",
]

[project.optional-dependencies]
mfa = [
    "seaborn>=0.12",
    "scikit-learn>=1.2",
    "statsmodels>=0.14",
]
transcriptomics = [
    "seaborn>=0.12",
    "scikit-learn>=1.2",
    "statsmodels>=0.14",
    "pydeseq2>=0.4",
    "gseapy>=1.1",
    "adjustText>=0.8",
]
metabolomics = [
    "seaborn>=0.12",
    "scikit-learn>=1.2",
    "statsmodels>=0.14",
    "gseapy>=1.1",
]
proteomics = [
    "seaborn>=0.12",
    "scikit-learn>=1.2",
    "statsmodels>=0.14",
    "gseapy>=1.1",
]
integration = [
    "seaborn>=0.12",
    "statsmodels>=0.14",
    "adjustText>=0.8",
]
# FASTQ 修剪等上游原始数据处理；kallisto / DIA-NN 等外部程序需另行安装。
upstream = [
    "cutadapt>=4.0",
]
all = [
    "omicsweave[mfa,transcriptomics,metabolomics,proteomics,integration]",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
omicsweave = "omicsweave.cli:main"

[tool.setuptools.dynamic]
version = { attr = "omicsweave.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"omicsweave.integration.mappings" = ["*.yaml"]
"omicsweave.integration" = ["examples/*.yaml", "examples/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
