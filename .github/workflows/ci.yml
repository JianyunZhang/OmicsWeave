name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[all,dev]"
      - name: Test
        run: python -m pytest
      - name: Validate demo project
        run: omicsweave --project-dir examples/demo_project validate

  minimal:
    # 只装基础依赖：核心模块与命令行入口必须可导入
    name: minimal install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Import check
        run: |
          python -c "import omicsweave, omicsweave.core, omicsweave.core.validate, omicsweave.contract, omicsweave.cli"
          omicsweave --version
          omicsweave --project-dir examples/demo_project validate
